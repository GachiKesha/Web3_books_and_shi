version: "3.8"

services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: health_system
    ports:
      - "5432:5432"

  book_postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: book_db
    ports:
      - "5433:5432"

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  api-gateway:
    build: ./services/api-gateway
    depends_on:
      - rabbitmq
      - postgres
    environment:
      RABBITMQ_URL: amqp://rabbitmq
      DATABASE_URL: postgres://admin:password@postgres:5432/health_system
    ports:
      - "3000:3000"

  book-service:
    build: ./services/book-service
    depends_on:
      - book_postgres
    environment:
      POSTGRES_HOST: book_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: book_db
    ports:
      - "3001:3001"
